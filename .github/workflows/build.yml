name: Build The New Lord
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  ORIENTATION: fullSensor
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Unpack the game
        run: for z in nl-part*.zip; do unzip -o -q "$z"; done
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Check the Android SDK
        id: sdk
        run: if [ -d "$ANDROID_HOME/platforms" ]; then echo "found=yes" >> $GITHUB_OUTPUT; echo "Android SDK at $ANDROID_HOME"; else echo "found=no" >> $GITHUB_OUTPUT; fi
      - name: Install the Android SDK if missing
        if: steps.sdk.outputs.found != 'yes'
        uses: android-actions/setup-android@v3
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: App icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor "#0b0a0e" --splashBackgroundColor "#0b0a0e"
      - name: Full screen and orientation
        run: bash scripts/android-setup.sh
      - name: Copy the game into the app
        run: npx cap sync android
      - name: Use the same signing key every build (so updates install over the old app)
        run: mkdir -p ~/.android && cp scripts/debug.keystore ~/.android/debug.keystore
      - name: Build the APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TheNewLord-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  web:
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - name: Unpack the game
        run: for z in nl-part*.zip; do unzip -o -q "$z"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - uses: actions/deploy-pages@v4

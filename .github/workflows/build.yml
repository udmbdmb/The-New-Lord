# Builds an installable Android app (APK) every time you push, and publishes the
# game as an installable web app on GitHub Pages. Nothing to install on your computer.
name: Build The New Lord

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # How the app may turn: "fullSensor" = both ways (default), "sensorLandscape" = sideways only,
  # "sensorPortrait" = upright only.
  ORIENTATION: fullSensor

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the game (the nl-part zips)
        run: for z in nl-part*.zip; do unzip -o -q "$z"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b0a0e' --splashBackgroundColor '#0b0a0e'

      - name: Full screen, orientation, keep the screen awake
        run: | M=android/app/src/main/AndroidManifest.xml sed -i "s/<activity /<activity android:screenOrientation=\"${ORIENTATION}\" /" $M S=android/app/src/main/res/values/styles.xml sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item><item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#g' $S J=$(find android/app/src/main/java -name MainActivity.java) cat > $J <<'JAVA' package com.thenewlord.game; import android.os.Bundle; import android.view.View; import android.view.WindowManager; import com.getcapacitor.BridgeActivity; public class MainActivity extends BridgeActivity { @Override public void onCreate(Bundle b){ super.onCreate(b); getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); hide(); } @Override public void onWindowFocusChanged(boolean f){ super.onWindowFocusChanged(f); if(f) hide(); } private void hide(){ getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN); } } JAVA sed -i 's/^ //' $J 
      - name: Copy the game into the app
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TheNewLord-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the game (the nl-part zips)
        run: for z in nl-part*.zip; do unzip -o -q "$z"; done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

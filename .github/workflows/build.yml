name: Build The New Lord
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  ORIENTATION: fullSensor
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the game
        run: for z in nl-part*.zip; do unzip -o -q "$z"; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: App icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor "#0b0a0e" --splashBackgroundColor "#0b0a0e"
      - name: Full screen and orientation
        run: bash scripts/android-setup.sh
      - name: Copy the game into the app
        run: npx cap sync android
      - name: Build the APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TheNewLord-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  web:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the game
        run: for z in nl-part*.zip; do unzip -o -q "$z"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - uses: actions/deploy-pages@v4
